<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - Leenard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css" />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: { primary: "#facc15", light: "#fefce8", dark: "#1c1917" },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-light dark:bg-dark text-gray-800 dark:text-gray-200 transition-colors duration-300 font-sans flex flex-col min-h-screen"
  >
    <nav
      class="bg-white/90 dark:bg-stone-900/90 backdrop-blur-md sticky top-0 z-50 border-b border-yellow-200 dark:border-stone-700"
    >
      <div class="max-w-5xl mx-auto px-6 py-4">
        <div class="flex justify-between items-center">
          <a
            href="index.html"
            class="text-xl font-bold hover:text-yellow-600 transition"
          >
            Leenard<span class="text-yellow-500">.</span>
          </a>

          <div class="hidden md:flex items-center gap-8 text-sm font-medium">
            <a href="index.html" class="hover:text-yellow-500 transition"
              >Home</a
            >
            <a href="about.html" class="hover:text-yellow-500 transition"
              >About</a
            >
            <a href="portfolio.html" class="hover:text-yellow-500 transition"
              >Gallery</a
            >
            <a href="contact.html" class="hover:text-yellow-500 transition"
              >Contact</a
            >

            <button
              onclick="toggleTheme()"
              class="p-2 hover:bg-yellow-100 dark:hover:bg-stone-700 rounded-full transition"
            >
              <svg
                class="w-5 h-5 hidden dark:block text-yellow-400"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
                ></path>
              </svg>
              <svg
                class="w-5 h-5 block dark:hidden text-gray-600"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
                ></path>
              </svg>
            </button>
          </div>

          <button
            class="md:hidden p-2 text-gray-600 dark:text-gray-300"
            onclick="document.getElementById('mobileMenu').classList.toggle('hidden')"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              ></path>
            </svg>
          </button>
        </div>
      </div>

      <div
        id="mobileMenu"
        class="hidden md:hidden bg-yellow-50 dark:bg-stone-800 border-t border-yellow-200 dark:border-stone-700 p-4"
      >
        <div class="flex flex-col space-y-4 text-center font-medium">
          <a
            href="index.html"
            class="block py-2 hover:text-yellow-600 dark:text-gray-200"
            >Home</a
          >
          <a
            href="about.html"
            class="block py-2 hover:text-yellow-600 dark:text-gray-200"
            >About Me</a
          >
          <a
            href="portfolio.html"
            class="block py-2 hover:text-yellow-600 dark:text-gray-200"
            >Gallery</a
          >
          <a
            href="contact.html"
            class="block py-2 hover:text-yellow-600 dark:text-gray-200"
            >Contact</a
          >
        </div>
      </div>
    </nav>

    <main class="flex-grow flex flex-col items-center justify-center p-6">
      <div
        class="bg-white dark:bg-stone-800 p-8 rounded-3xl shadow-sm border border-yellow-100 dark:border-stone-700 max-w-lg w-full"
      >
        <h1 class="text-3xl font-bold mb-2">
          Contact <span class="text-yellow-500">Me</span>
        </h1>
        <p class="text-gray-500 dark:text-gray-400 mb-6">
          Send me a message if you want to hang out or do a photoshoot!
        </p>

        <div
          id="successMessage"
          class="hidden bg-green-100 text-green-700 p-4 rounded-xl mb-6 text-center text-sm font-bold"
        >
          Message Sent Successfully!
        </div>

        <form
          class="space-y-4"
          onsubmit="event.preventDefault(); document.getElementById('successMessage').classList.remove('hidden');"
        >
          <div>
            <label class="block text-sm font-bold mb-1">Name</label>
            <input
              type="text"
              class="w-full bg-yellow-50 dark:bg-stone-900 border border-yellow-200 dark:border-stone-600 rounded-lg p-3"
              placeholder="Your Name"
            />
          </div>
          <div>
            <label class="block text-sm font-bold mb-1">Email</label>
            <input
              type="email"
              class="w-full bg-yellow-50 dark:bg-stone-900 border border-yellow-200 dark:border-stone-600 rounded-lg p-3"
              placeholder="your@email.com"
            />
          </div>
          <div>
            <label class="block text-sm font-bold mb-1">Message</label>
            <textarea
              rows="3"
              class="w-full bg-yellow-50 dark:bg-stone-900 border border-yellow-200 dark:border-stone-600 rounded-lg p-3"
              placeholder="Hello..."
            ></textarea>
          </div>
          <button
            type="submit"
            class="w-full bg-yellow-400 hover:bg-yellow-500 text-stone-900 font-bold py-3 rounded-lg transition"
          >
            Send Message
          </button>
        </form>

        <div
          class="mt-8 pt-8 border-t border-yellow-100 dark:border-stone-700 text-center"
        >
          <p class="text-sm font-bold text-gray-500 mb-4">
            You can also contact me here:
          </p>
          <div class="flex justify-center gap-6">
            <a
              href="https://www.facebook.com/leenard.rivera.52"
              target="_blank"
              class="flex items-center gap-2 text-blue-600 hover:underline"
            >
              <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
                />
              </svg>
              <span>Leenard Rivera</span>
            </a>

            <a
              href="mailto:leenard@example.com"
              class="flex items-center gap-2 text-red-500 hover:underline"
            >
              <svg
                class="w-6 h-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                ></path>
              </svg>
              <span>Leenard78@gmail.com</span>
            </a>
          </div>
        </div>
      </div>
    </main>

    <footer
      class="bg-white dark:bg-stone-900 border-t border-yellow-200 dark:border-stone-800 py-8 text-center text-sm text-gray-500"
    >
      <p>&copy; 2026 Leenard F. Rivera. All rights reserved.</p>
    </footer>

    <script>
      if (
        localStorage.theme === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
      function toggleTheme() {
        if (document.documentElement.classList.contains("dark")) {
          document.documentElement.classList.remove("dark");
          localStorage.theme = "light";
        } else {
          document.documentElement.classList.add("dark");
          localStorage.theme = "dark";
        }
      }
    </script>
  </body>
</html>
